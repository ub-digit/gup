version: '3.7'
services:
  frontend:
    image: docker.ub.gu.se/gup-frontend:${GIT_REVISION}
    build:
      context: ./frontend
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_REVISION=${GIT_REVISION}
  varnish:
    image: docker.ub.gu.se/gup-varnish:${GIT_REVISION}
    build:
      context: ./varnish # TODO: Copy default.vcl from repo as for solr and postgres
  backend:
    image: docker.ub.gu.se/gup-backend:${GIT_REVISION}
    build:
      context: ./backend
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_REVISION=${GIT_REVISION}
  solr:
    image: docker.ub.gu.se/gup-solr:${GIT_REVISION}
    build:
      context: ./solr
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_REVISION=${GIT_REVISION}
  postgres:
    image: docker.ub.gu.se/gup-postgres:${GIT_REVISION}
    build:
      context: ./postgres
      args:
        - GIT_REPO_URL=${GIT_REPO_URL}
        - GIT_REVISION=${GIT_REVISION}
