---
- name: Deploy
  hosts: all
  tasks:
  - name: Deploy app
    include_role:
      name: ub-ansible-deploy

  - name: Ensure apache static configuration
    become: true
    ansible.builtin.template:
      src: 'apache-static.conf.j2'
      dest: "{{ [data_dirs['apache_static_sites'].path, 'default.conf'] | path_join }}"


